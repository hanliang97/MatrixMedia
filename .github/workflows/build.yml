name: Upload Electron Package

on:
  push:
    branches:
      - prod

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.15.1"
      - name: Extract repository name
        id: extract-repo-name
        run: |
          OWNER_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $1}')
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          echo "owner-name=$OWNER_NAME" >> $GITHUB_OUTPUT
          echo "repo-name=$REPO_NAME" >> $GITHUB_OUTPUT
        shell: bash
      - name: Install dependencies
        # 覆盖仓库 .yarnrc 里的 npmmirror 源：GitHub Actions runner 在海外，
        # 访问国内镜像不稳定（ESOCKETTIMEDOUT），CI 统一走官方源
        env:
          YARN_CONFIG_REGISTRY: https://registry.npmjs.org
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: yarn
      - name: Build Electron app (Windows)
        run: yarn build
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/MatrixMedia-*-win-*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.15.1"
      - name: Install dependencies
        env:
          YARN_CONFIG_REGISTRY: https://registry.npmjs.org
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: yarn
      - name: Build Electron app (macOS x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn build:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: build/MatrixMedia-*-mac-*.dmg

  build-linux:
    # 固定 24.04：26.04 镜像的 rpmbuild 对 /opt/矩媒 非 ASCII 安装路径构建失败
    # （v0.13.5 起挂，deb/AppImage 不受影响）；改 ASCII 路径会影响存量 rpm/deb 升级，另行处理
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.15.1"
      - name: Install dependencies
        env:
          YARN_CONFIG_REGISTRY: https://registry.npmjs.org
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: yarn
      - name: Build Electron app (Linux x64 + arm64, all targets)
        # CI 负责 macOS 本地打不了的产物：deb / rpm，以及 arm64 全部格式
        run: yarn build:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-all
          path: |
            build/MatrixMedia-*-linux-*.AppImage
            build/MatrixMedia-*-linux-*.deb
            build/MatrixMedia-*-linux-*.rpm
            build/MatrixMedia-*-linux-*.tar.gz

  release-github:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read version from package.json
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Generate release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/gen-release-notes.js
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-gh
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist-gh/**/*.exe
            dist-gh/**/*.dmg
            dist-gh/**/*.AppImage
            dist-gh/**/*.deb
            dist-gh/**/*.rpm
            dist-gh/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.ver.outputs.version }}

  # NOTE: Gitee 上传已改为本地执行（见仓库根 pushall.js），不再走 GitHub Actions 同步。
  # 如需事后从 GitHub Release 补传到 Gitee，使用 .github/workflows/sync-gitee.yml 手动触发。
